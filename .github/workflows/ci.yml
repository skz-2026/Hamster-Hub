name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端（typecheck + build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

  e2e:
    name: E2E 冒烟（Playwright + mock）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: npx playwright install chromium --with-deps

      - run: pnpm e2e

  rust:
    name: Rust（fmt + clippy + test）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: rustfmt
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml --check

      # 注意 --workspace：src-tauri/Cargo.toml 既是 workspace 根也是主包，
      # 不带 --workspace 时 cargo 只选 workspace_default_members（= hamster-hub），
      # 7 个 crates/* 兄弟包的 clippy 与单测会被整体跳过（2026-09-14 实测踩到）。
      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings

      - name: test（含 IPC 类型生成）
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace
